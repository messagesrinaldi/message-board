<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Message Board</title>
  <meta http-equiv="refresh" content="30">
  <style>
    body {
      background: #fdf6e3;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    h1 {
      font-size: 72px;
      text-align: center;
      color: #333;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1 id="msg">Loading…</h1>

<script>
  function loadMessage() {
    const url = 'message.txt?v=' + Date.now();  // cache‑buster
    fetch(url)
      .then(response => response.text())
      .then(text => {
        document.getElementById('msg').textContent = text;
      })
      .catch(err => {
        document.getElementById('msg').textContent = 'Error loading message';
      });
  }

  loadMessage();  // load immediately

  // reload message every 30 seconds without reloading the whole page
  setInterval(loadMessage, 30000);
</script>

</body>
</html>
